name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Rust test & clippy
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # 环境检查单测会用 node 探测「运行方式」；tauri 的 generate_context!
      # 编译期需要 dist 存在 —— 先装依赖并产出 dist 再跑测试。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (dist)
        run: pnpm build

      - name: Clippy
        # Windows 专属代码路径此前从未被 clippy 检查过，先观察输出不阻断，
        # 待 Windows 路径告警清零后再收紧为 -D warnings。
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (dist)
        run: pnpm build

      # 绿色交付：内置 JRE 随安装包分发（免安装、免系统环境变量）。
      # 下载 Adoptium Temurin 8 JRE 解压到 src-tauri/resource/jre，
      # tauri bundle.resources 会把它打进安装包，装到 exe 同级目录。
      - name: Bundle Temurin 8 JRE (resource/jre)
        shell: pwsh
        run: |
          $dest = "src-tauri/resource/jre"
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x64/jre/hotspot/normal/eclipse" -OutFile "$env:RUNNER_TEMP/jre.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/jre.zip" -DestinationPath "$env:RUNNER_TEMP/jre" -Force
          $root = (Get-ChildItem "$env:RUNNER_TEMP/jre" | Select-Object -First 1).FullName
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$root/*" $dest -Recurse -Force
          Write-Host "resource/jre 顶层内容：" (Get-ChildItem $dest | Select-Object -ExpandProperty Name)

      - name: Build Tauri (NSIS installer)
        run: pnpm tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dfy-ops-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
