name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'build'
        type: choice
        options:
          - build
          - release-only
      tag:
        description: 'release-only 模式专用：要发 release 的 tag（如 v0.2.68）'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  test:
    name: Rust test & clippy
    if: inputs.mode != 'release-only'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # 环境检查单测会用 node 探测「运行方式」；tauri 的 generate_context!
      # 编译期需要 dist 存在 —— 先装依赖并产出 dist 再跑测试。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (dist)
        run: pnpm build

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Clippy
        # Windows 专属代码路径此前从未被 clippy 检查过，先观察输出不阻断，
        # 待 Windows 路径告警清零后再收紧为 -D warnings。
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build Windows installer
    needs: test
    if: inputs.mode != 'release-only'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (dist)
        run: pnpm build

      # 绿色交付：内置 JRE 随安装包分发（免安装、免系统环境变量）。
      # 下载 Adoptium Temurin 8 JRE 解压到 src-tauri/resource/jre，
      # tauri bundle.resources 会把它打进安装包，装到 exe 同级目录。
      - name: Bundle Temurin 8 JRE (resource/jre)
        shell: pwsh
        run: |
          $dest = "src-tauri/resource/jre"
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x64/jre/hotspot/normal/eclipse" -OutFile "$env:RUNNER_TEMP/jre.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/jre.zip" -DestinationPath "$env:RUNNER_TEMP/jre" -Force
          $root = (Get-ChildItem "$env:RUNNER_TEMP/jre" | Select-Object -First 1).FullName
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$root/*" $dest -Recurse -Force
          Write-Host "resource/jre 顶层内容：" (Get-ChildItem $dest | Select-Object -ExpandProperty Name)

      - name: Build Tauri (NSIS installer)
        run: pnpm tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dfy-ops-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          # GitHub release API 偶发 500（finalize 阶段）；默认重试次数不够。
          # 仍挂 → Actions 页手动 Run workflow → mode=release-only + tag。
          retries: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== Release 挂掉时的救星：只从既有构建 artifact 重发 release，不重编 =====
  #
  # 两个历史坑（v0.2.68 的 #132 两次踩中）：
  # 1. workflow_dispatch 必须声明在工作流级 on: 下，写进 job 是非法语法，
  #    会导致整个工作流文件 invalid、所有构建一起挂；
  # 2. download-artifact@v4 默认只下载「当前 run」的 artifact，跨 run 下载
  #    必须显式给 run-id + github-token（且 token 需要 actions:read）。
  #
  # 用法：Actions 页 Run workflow → mode=release-only，tag 填 v0.2.68。
  manual-release:
    name: Release only (不重编，从既有 artifact 重发)
    if: inputs.mode == 'release-only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Locate build run for tag
        id: findrun
        run: |
          RUN_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ inputs.tag }}&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::tag ${{ inputs.tag }} 没有对应的构建 run"
            exit 1
          fi
          echo "使用构建 run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download installer from that run
        uses: actions/download-artifact@v4
        with:
          name: dfy-ops-windows
          path: ./artifacts
          run-id: ${{ steps.findrun.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create / finalize release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: artifacts/*.exe
          retries: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
