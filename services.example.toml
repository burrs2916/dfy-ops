# DFY 运维平台 · 服务注册表示例
# 加载优先级：config_dir/services.toml（自动加载，本机覆盖） > DFY_OPS_SERVICES 环境变量 > 内置默认定义。
#   环境变量方式：DFY_OPS_SERVICES=C:/path/to/services.toml
#   本机覆盖方式：把本文件放到应用配置目录并改名 services.toml（macOS:
#   ~/Library/Application Support/com.dfy.ops/，Windows: %APPDATA%/com.dfy.ops/）
#
# ⚠️ 覆盖按 id 合并：配置里同 id 的服务整体替换内置定义，未提及的内置服务保留
#    （内置含第三方依赖 vernemq/minio，勿在本机配置里重复定义，除非要改端口/路径）。
#
# 检测模型：进程是事实来源，端口由进程反查——平台不规定服务用什么端口。
#   processNames（可选，按运行器特征写，如 "java -jar xx.jar" 里的 jar 名、"ng serve"）：
#     命中进程后用 lsof/netstat 反查其【实际监听端口】，检测与展示均以实际端口为准；
#     Shell / IDE / agent 宿主进程会被自动剔除，避免误命中。
#     Windows 注意：镜像名匹配（含/不含 .exe）落空时自动按命令行子串匹配——
#     Erlang 系应用（VerneMQ 的 beam.smp.exe 与 RabbitMQ 共用镜像名）必须靠命令行区分。
#   ports：仅用于本平台拉起服务后的就绪等待（编排目标），以及未配置 processNames 时的探测兜底。
#
# thirdParty（默认 false）：第三方系统级中间件（VerneMQ/MinIO 等）置 true——
#   平台只检测不托管：不参与「全部启动/停止」、无启停/构建按钮、Dashboard 分组展示；
#   运行由 Windows 服务管理器或容器运行时（本机开发可用 OrbStack/Docker）负责。

[[services]]
id = "dfy-backend"
name = "DFY 后端 (Vert.x)"
kind = "vertx"
installDir = "C:/services/dfy-boot-base"
buildCmd = "mvn -q -DskipTests package"
runCmd = "java -jar dfy-server/target/dfy-server.jar"
ports = [48085]
logPaths = ["C:/services/dfy-boot-base/logs/app.log"]
dependsOn = []
isDaemon = true
description = "鼎飞益智后端服务（Java Vert.x），默认端口 48085。"

[[services]]
id = "dfy-ui"
name = "DFY 管理前端 (Vue3)"
kind = "vue_spa"
installDir = "C:/services/dfy-ui-admin-vue3-master"
buildCmd = "pnpm build:prod"
runCmd = "nginx -p C:/services/dfy-ui-admin-vue3-master -c nginx.conf"
ports = [80]
logPaths = ["C:/services/nginx/logs/access.log"]
dependsOn = ["dfy-backend"]
isDaemon = true
description = "Vue3 管理后台，由 nginx 托管于 80 端口，反代 /api 到后端 48085。"

[[services]]
id = "gateway-console"
name = "Gateway Console (Angular)"
kind = "angular_spa"
installDir = "C:/services/gateway-console"
buildCmd = "npm run build:prod"
runCmd = "nginx -p C:/services/gateway-console -c nginx.conf"
ports = [8081]
logPaths = []
dependsOn = []
isDaemon = true
description = "Angular 19 网关控制台，静态托管。dev 机可用 ng serve（4200，绑定 [::1]），探测已兼容 IPv6 回环。"

[[services]]
id = "edge-conductor"
name = "Edge Conductor (Rust Axum)"
kind = "rust_bin"
installDir = "C:/services/edge-conductor"
buildCmd = "cargo build --release"
runCmd = "C:/services/edge-conductor/target/release/edgecd-daemon --config C:/services/edge-conductor/config.toml"
ports = [8084, 8085]
processNames = ["edgecd-daemon"]
logPaths = ["C:/services/edge-conductor/logs"]
dependsOn = ["dfy-backend", "vernemq", "minio"]
isDaemon = true
description = "边缘计算后端；8084/8085 为自身监听端口，依赖 VerneMQ/MinIO（独立注册的第三方服务）与 DFY 后端 48085。"

[[services]]
id = "biosphere-spatial"
name = "Biosphere 空间系统 (Tauri)"
kind = "tauri_app"
installDir = "C:/services/biosphere-spatialdata-system"
buildCmd = "pnpm tauri build"
runCmd = "C:/services/biosphere-spatialdata-system/target/release/biosphere-spatialdata-system.exe"
ports = []
processNames = ["biosphere-spatialdata-system"]
logPaths = []
dependsOn = []
isDaemon = false
description = "空间数据系统桌面客户端；无端口，按进程名检测（非常驻，不参与批量启动）。"

# ===== 第三方依赖：平台只检测不托管 =====

[[services]]
id = "vernemq"
name = "VerneMQ (MQTT)"
kind = "mqtt_broker"
installDir = "C:/services/vernemq"
runCmd = ""
ports = [18830]
processNames = ["vernemq"]
logPaths = []
dependsOn = []
isDaemon = true
thirdParty = true
description = "第三方 MQTT broker（Erlang/OTP）；Windows 实际进程为 beam.smp.exe，按命令行含 vernemq 匹配（与 RabbitMQ 区分）。实际端口由进程反查（MQTT 18830 / 状态页 8888）。"

[[services]]
id = "minio"
name = "MinIO (对象存储)"
kind = "object_storage"
installDir = "C:/services/minio"
runCmd = ""
ports = [9000]
processNames = ["minio", "minio.exe"]
logPaths = []
dependsOn = []
isDaemon = true
thirdParty = true
description = "第三方 S3 兼容对象存储；minio.exe 进程反查实际端口（API 9000 + console 端口如实显示）。"
