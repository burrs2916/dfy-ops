[package]
name = "dfy-ops"
version = "0.2.31"
description = "DFY运维平台"
authors = ["DFY"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dfy_ops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Redis 原生客户端：RESP 协议 TCP 直连（纯 Rust，零外部依赖），
# Redis 管理不再依赖 redis-cli.exe 子进程
redis = "1.7"
# MQTT 真实客户端：VerneMQ 探测用 rumqttc 的同步 Client
# —— 替换手写协议帧，让连接、超时、CONNACK 解析由成熟库处理
rumqttc = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
netdev = "0.46.3"
chrono = "0.4"
dirs-next = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# 依赖树中已存在（tauri 传递依赖）；这里显式声明用于 dev 模式设置 Dock 图标
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
# WebView2 Runtime 注册表检测（环境检查：Tauri 桌面客户端运行时依赖）
winreg = "0.52"
# 环境变量变更广播（SendMessageTimeoutW / WM_SETTINGCHANGE）
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
